<!DOCTYPE html>

<head>

    <style>
        /* Typography and External Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Nunito:wght@400;600;800&display=swap');

        :root {
            --bg: #0a0a0c;
            --stroke-primary: #e2e8f0;
            --accent-1: #feca57; /* Yellow/Gold for highlights */
            --accent-2: #ff6b6b; /* Red/Coral for warnings/emphasis */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-sketch: 'Caveat', cursive, sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden;
            touch-action: none; /* Prevent browser swipe navigation */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Presentation Container */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #111116 0%, #050505 100%);
        }

        /* 16:9 Canvas Area */
        #canvas-area {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 16 / 9);
            max-height: calc(100vw * 9 / 16);
            background: transparent;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Slides */
        .slide-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease; /* Erase/Wipe transition */
            z-index: 1;
        }

        .slide-svg.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        /* Sketch Elements Styling */
        path, line, polyline, circle, rect {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stroke-primary { stroke: var(--stroke-primary); stroke-width: 4; }
        .stroke-thick { stroke: var(--stroke-primary); stroke-width: 7; }
        .stroke-accent { stroke: var(--accent-1); stroke-width: 5; }
        .stroke-accent2 { stroke: var(--accent-2); stroke-width: 5; }
        .stroke-thin { stroke: var(--stroke-primary); stroke-width: 2; }
        .stroke-dashed { stroke-dasharray: 10 15; }
        
        .fill-primary { fill: var(--stroke-primary); stroke: none; }
        .fill-accent { fill: var(--accent-1); stroke: none; }

        /* Text Elements embedded in SVG */
        .fo-text {
            overflow: visible;
        }
        
        h1, h2, h3, .sketch-font {
            font-family: var(--font-sketch);
            font-weight: 700;
        }

        .heading { font-size: 64px; color: var(--accent-1); line-height: 1.1; letter-spacing: 2px;}
        .subheading { font-size: 42px; color: var(--text-main); }
        .body-text { font-size: 26px; color: var(--text-main); font-weight: 600; line-height: 1.5; }
        .small-text { font-size: 20px; color: var(--text-muted); }
        .accent-text { color: var(--accent-1); }
        .warning-text { color: var(--accent-2); }
        
        .box-text { font-size: 32px; font-family: var(--font-sketch); text-align: center; color: var(--bg); font-weight: 700;}
        .box-text-light { font-size: 32px; font-family: var(--font-sketch); text-align: center; color: var(--text-main); }

        ul.sketch-list {
            list-style: none;
            padding-left: 20px;
        }
        ul.sketch-list li {
            position: relative;
            margin-bottom: 15px;
            font-size: 28px;
        }
        ul.sketch-list li::before {
            content: "→";
            position: absolute;
            left: -35px;
            color: var(--accent-1);
            font-family: var(--font-sketch);
            font-size: 35px;
            top: -8px;
        }

        /* UI Controls */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .controls-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            background: rgba(10, 10, 12, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 1; transform: scale(1.05); color: var(--accent-1); }
        button:active { transform: scale(0.95); }
        
        button svg { width: 20px; height: 20px; fill: currentColor; }

        #progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 100;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-1);
            transition: width 0.3s ease;
        }

        #slide-counter {
            font-family: var(--font-sketch);
            font-size: 24px;
            color: var(--accent-1);
            letter-spacing: 2px;
        }

        /* Fullscreen specific */
        :fullscreen #canvas-area { max-width: 100vw; max-height: 100vh; }
        
        /* Utility for quick flex alignment in foreignObjects */
        .flex-col { display: flex; flex-direction: column; }
        .flex-row { display: flex; flex-direction: row; align-items: center; }
        .gap-2 { gap: 10px; }
        .gap-4 { gap: 20px; }
    </style>
</head>

                <path class="seq-anim stroke-accent stroke-thick" d="M 650 150 Q 800 160 950 145" />

                <foreignObject x="200" y="200" width="1200" height="150" class="seq-anim fo-text">
                    <p class="body-text" style="text-align: center; font-size: 32px;">Digital marketing <span class="accent-text">connects</span> businesses with customers,<br>while e-commerce <span class="accent-text">enables</span> digital buying and selling.<br>Together, they have transformed the modern marketplace.</p>
                </foreignObject>

                <!-- Flowchart summary -->
                <path class="seq-anim stroke-primary stroke-thick" d="M 200 400 L 1400 400" />
                <circle class="seq-anim stroke-accent stroke-thick fill-primary" cx="200" cy="400" r="15" />
                <foreignObject x="100" y="430" width="200" height="80" class="seq-anim fo-text"><p class="sketch-font" style="text-align:center; font-size: 28px;">Traditional<br>Market</p></foreignObject>
                
                <circle class="seq-anim stroke-accent stroke-thick fill-primary" cx="500" cy="400" r="15" />
                <foreignObject x="400" y="430" width="200" height="80" class="seq-anim fo-text"><p class="sketch-font" style="text-align:center; font-size: 28px;">Internet<br>Revolution</p></foreignObject>

                <circle class="seq-anim stroke-accent stroke-thick fill-primary" cx="800" cy="400" r="15" />
                <foreignObject x="700" y="430" width="200" height="80" class="seq-anim fo-text"><p class="sketch-font" style="text-align:center; font-size: 28px;">Digital<br>Marketing</p></foreignObject>

                <circle class="seq-anim stroke-accent stroke-thick fill-primary" cx="1100" cy="400" r="15" />
                <foreignObject x="1000" y="430" width="200" height="80" class="seq-anim fo-text"><p class="sketch-font" style="text-align:center; font-size: 28px;">E-Commerce</p></foreignObject>

                <circle class="seq-anim stroke-accent2 stroke-thick fill-primary" cx="1400" cy="400" r="25" />
                <foreignObject x="1300" y="440" width="200" height="80" class="seq-anim fo-text"><p class="sketch-font warning-text" style="text-align:center; font-size: 32px;">Connected<br>Customer</p></foreignObject>

                <!-- Outro -->
                <foreignObject x="600" y="600" width="400" height="200" class="seq-anim fo-text">
                    <h1 class="heading" style="text-align: center; font-size: 80px;">Thank You!</h1>
                    <p class="body-text small-text" style="text-align: center; margin-top: 20px;">Presented by:<br><span class="sketch-font accent-text" style="font-size: 36px; color: white;">Kartik Chouhan</span><br>Roll No: 250408 | M.Com 3rd Sem</p>
                </foreignObject>
            </svg>

        </div>

        <!-- UI Overlays -->
        <div id="ui-layer">
            <div id="slide-counter">01 / 15</div>
            <div class="controls-group">
                <button id="btn-prev" title="Previous Slide">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <button id="btn-replay" title="Replay Animation">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                </button>
                <button id="btn-skip" title="Skip Animation">
                    <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                </button>
                <button id="btn-next" title="Next Slide">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
                <button id="btn-fullscreen" title="Fullscreen">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const totalSlides = 15;
        let currentSlide = 1;
        let isAnimating = false;
        let skipRequested = false;
        let activeAnimationId = 0;

        const svgs = document.querySelectorAll('.slide-svg');
        const progressBar = document.getElementById('progress-bar');
        const counter = document.getElementById('slide-counter');

        const wait = ms => new Promise(res => setTimeout(res, ms));

        function updateUI() {
            counter.innerText = `${currentSlide.toString().padStart(2, '0')} / ${totalSlides}`;
            progressBar.style.width = `${((currentSlide - 1) / (totalSlides - 1)) * 100}%`;
        }

        async function playSlide(index, replay = false) {
            currentSlide = index;
            const animId = ++activeAnimationId;
            skipRequested = false;
            updateUI();

            // Handle visibility/transitions
            svgs.forEach((svg, i) => {
                if(i === index - 1) {
                    svg.classList.add('active');
                } else {
                    svg.classList.remove('active');
                }
            });

            const activeSvg = svgs[index - 1];
            const elements = activeSvg.querySelectorAll('.seq-anim');

            // Reset all elements in current slide
            elements.forEach(el => {
                if(el.tagName === 'path' || el.tagName === 'polyline' || el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'rect') {
                    const len = el.getTotalLength() || 2000;
                    el.style.transition = 'none';
                    el.style.strokeDasharray = len;
                    el.style.strokeDashoffset = len;
                    el.style.opacity = '1';
                } else {
                    el.style.transition = 'none';
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(15px)';
                }
            });

            await wait(100); // Wait for transition wipe
            isAnimating = true;

            // Sequential Draw
            for (let el of elements) {
                if(animId !== activeAnimationId) return; // Sequence aborted (user changed slide)
                
                if(skipRequested) {
                    elements.forEach(e => forceShow(e));
                    break;
                }

                if (el.tagName === 'path' || el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'rect') {
                    const len = el.getTotalLength() || 1000;
                    // Dynamic duration based on line length
                    let duration = Math.max(300, Math.min(len * 1.5, 1200)); 
                    
                    el.style.transition = `stroke-dashoffset ${duration}ms ease-in-out`;
                    el.getBoundingClientRect(); // trigger reflow
                    el.style.strokeDashoffset = '0';
                    await wait(duration + 100);
                } else {
                    // Foreign object / text pop in
                    el.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                    await wait(500); // Reading time before next stroke
                }
            }
            isAnimating = false;
        }

        function forceShow(el) {
            el.style.transition = 'none';
            if (el.style.strokeDashoffset !== undefined) {
                el.style.strokeDashoffset = '0';
            }
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
        }

        function nextSlide() {
            if(currentSlide < totalSlides) {
                playSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            if(currentSlide > 1) {
                playSlide(currentSlide - 1);
            }
        }

        // Event Listeners
        document.getElementById('btn-next').addEventListener('click', nextSlide);
        document.getElementById('btn-prev').addEventListener('click', prevSlide);
        document.getElementById('btn-replay').addEventListener('click', () => playSlide(currentSlide));
        document.getElementById('btn-skip').addEventListener('click', () => {
            if(isAnimating) skipRequested = true;
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight' || e.key === ' ') {
                if(isAnimating) skipRequested = true;
                else nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Touch/Swipe Navigation
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if(touchEndX < touchStartX - 50) { // Swipe Left -> Next
                if(isAnimating) skipRequested = true;
                else nextSlide();
            }
            if(touchEndX > touchStartX + 50) { // Swipe Right -> Prev
                prevSlide();
            }
        }

        // Hide/Show Controls on Mouse Move
        let timeout;
        const uiLayer = document.getElementById('ui-layer');
        document.addEventListener('mousemove', () => {
            uiLayer.style.opacity = '1';
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                if(!document.querySelector('.controls-group:hover')) {
                    uiLayer.style.opacity = '0.3'; // fade slightly to not distract
                }
            }, 3000);
        });

        // Initialize First Slide
        window.onload = () => {
            playSlide(1);
        };
    </script>
